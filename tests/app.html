<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>MWP Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="../web/style.css">
</head>
<body>
<div id="app" dir="ltr">
  <div id="signin" class="gut" hidden><div class="col">
    <h1 id="siTtl"></h1>
    <p id="siSub"></p>
    <form id="siForm">
      <input id="siEmail" type="email" autocomplete="username" required>
      <input id="siPass" type="password" autocomplete="current-password" required minlength="8">
      <button class="giant" id="siBtn" type="submit"></button>
    </form>
    <div id="siMsg" class="msg" hidden></div>
  </div></div>
  <div id="home" class="gut" hidden><div class="col">
    <div class="hd">
      <h1><span id="ttl"></span><small><i class="live" id="dot"></i><span id="sync"></span></small></h1>
      <button class="sm" id="refresh" type="button" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>
      <button class="sm" id="lang" type="button"></button>
    </div>
    <div id="banner" class="banner" hidden></div>
    <form id="pwBox" class="pwbox" hidden>
      <b id="pwTtl"></b>
      <span id="pwSub"></span>
      <input id="pw1" type="password" autocomplete="new-password" minlength="8" required>
      <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
      <div class="pwbtns"><button class="dark" id="pwSave" type="submit"></button><button class="soft" id="pwLater" type="button"></button></div>
      <div id="pwMsg" class="msg" hidden></div>
    </form>
    <div class="toprow">
      <div class="focusbar" id="focusBar" hidden></div>
      <input class="search" id="q" type="search" autocomplete="off">
    </div>
    <div class="tabwrap" id="tabwrap" hidden>
      <button type="button" class="tarr prev" id="tPrev" aria-label="More tabs" hidden></button>
      <div id="tabs" class="tabs" role="tablist"></div>
      <button type="button" class="tarr next" id="tNext" aria-label="More tabs" hidden></button>
      <div class="secpill" id="secPill" aria-hidden="true"></div>
    </div>
    <div class="focushead" id="focusHead" hidden></div>
    <div id="list"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <button class="later" id="later" type="button" hidden></button>
    <div class="who"><span id="whoName"></span> · <button type="button" id="chpw"></button> · <button type="button" id="signout"></button></div>
  </div></div>
  <div id="lead" class="gut" hidden><div class="col" id="leadBody"></div></div>
  <div class="dlg" id="delDlg" role="dialog" aria-modal="true" aria-labelledby="delTtl" hidden>
    <div class="dlgbox">
      <b id="delTtl"></b>
      <p id="delSub"></p>
      <div class="dlgbtns"><button type="button" class="soft" id="delNo"></button><button type="button" class="danger" id="delYes"></button></div>
    </div>
  </div>
  <div class="dlg" id="focusDlg" role="dialog" aria-modal="true" aria-labelledby="fdTtl" hidden>
    <div class="dlgbox">
      <b id="fdTtl"></b>
      <p id="fdSub"></p>
      <input id="fdName" class="fdin" maxlength="60" autocomplete="off">
      <span class="fdl" id="fdStL"></span>
      <div class="fdst" id="fdSt"></div>
      <span class="fdl" id="fdKwL"></span>
      <textarea id="fdKw" class="fdin" rows="2"></textarea>
      <span class="fdcount" id="fdCount"></span>
      <div id="fdMsg" class="msg bad" hidden></div>
      <div class="dlgbtns"><button type="button" class="soft" id="fdNo"></button><button type="button" class="dark" id="fdSave"></button></div>
    </div>
  </div>
  <div class="toast" id="toast" hidden><div></div></div>
</div>
<script src="mock.js"></script>
<script type="module" src="../web/app.js"></script>
</body>
</html>
